<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Product Description Generator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#6a11cb,#2575fc);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:600px;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h1{
text-align:center;
margin-bottom:20px;
color:#333;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:14px;
font-size:18px;
border:none;
border-radius:8px;
background:#2575fc;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0b5ed7;
}

.loading{
display:none;
margin-top:15px;
text-align:center;
font-weight:bold;
color:#2575fc;
}

.output{
margin-top:20px;
padding:20px;
background:#f5f5f5;
border-radius:10px;
display:none;
white-space:pre-wrap;
line-height:1.6;
}

</style>

</head>
<body>

<div class="container">

<h1>🤖 AI Product Description Generator</h1>

<input
type="text"
id="productName"
placeholder="Product Name">

<input
type="text"
id="productCategory"
placeholder="Category">

<textarea
id="productFeatures"
placeholder="Enter Product Features"></textarea>

<button onclick="generate()">
Generate Description
</button>

<div id="loading" class="loading">
Generating Product Description...
</div>

<div id="output" class="output"></div>

</div>

<script>

async function generate(){

const name=document.getElementById("productName").value;
const category=document.getElementById("productCategory").value;
const features=document.getElementById("productFeatures").value;

if(name=="" || category==""){
alert("Please enter Product Name and Category");
return;
}

document.getElementById("loading").style.display="block";
document.getElementById("output").style.display="none";

try{

const response=await fetch("/api/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

productName:name,
productCategory:category,
productFeatures:features

})

});

const data=await response.json();

document.getElementById("loading").style.display="none";

document.getElementById("output").style.display="block";

document.getElementById("output").innerHTML=data.output;

}
catch(error){

document.getElementById("loading").style.display="none";

alert("Error : "+error);

}

}

</script>

</body>
</html>
